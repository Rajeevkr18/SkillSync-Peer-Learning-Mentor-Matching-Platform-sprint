server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/skillsync_payments?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

stripe:
  api:
    key: ${STRIPE_SECRET_KEY}
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
